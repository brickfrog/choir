[workspace]
resolver = "2"
members = ["crates/choir-core", "crates/choir"]

[workspace.package]
version = "4.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/brickfrog/choir"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
integer_division = "allow"
module_name_repetitions = "allow"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
